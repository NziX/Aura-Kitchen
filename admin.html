<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Kitchen - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-64 bg-white shadow-md hidden md:flex flex-col">
            <div class="h-16 flex items-center px-6 border-b">
                <i class="fa-solid fa-kitchen-set text-2xl text-emerald-600 mr-2"></i>
                <span class="font-bold text-xl tracking-tight text-gray-900">Aura Admin</span>
            </div>
            
            <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
                <a href="#" class="flex items-center px-4 py-3 text-emerald-700 bg-emerald-50 rounded-lg">
                    <i class="fa-solid fa-chart-pie w-6"></i>
                    <span class="font-medium">Dashboard</span>
                </a>
                <a href="#" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg transition">
                    <i class="fa-solid fa-box-open w-6"></i>
                    <span class="font-medium">Products</span>
                </a>
                <a href="#" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg transition">
                    <i class="fa-solid fa-cart-arrow-down w-6"></i>
                    <span class="font-medium">Orders</span>
                </a>
                <a href="#" class="flex items-center px-4 py-3 text-gray-600 hover:bg-gray-50 rounded-lg transition">
                    <i class="fa-solid fa-users w-6"></i>
                    <span class="font-medium">Customers</span>
                </a>
            </nav>
            
            <div class="p-4 border-t">
                <a href="index.html" class="flex items-center px-4 py-2 text-sm text-gray-600 hover:text-gray-900 transition">
                    <i class="fa-solid fa-store w-6"></i> View Store
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            
            <!-- Top header -->
            <header class="h-16 bg-white shadow-sm flex items-center justify-between px-6 z-10">
                <div class="flex items-center md:hidden">
                    <i class="fa-solid fa-kitchen-set text-2xl text-emerald-600 mr-2"></i>
                    <span class="font-bold text-lg text-gray-900">Aura Admin</span>
                </div>
                
                <div class="hidden md:block">
                    <h2 class="text-xl font-semibold text-gray-800">Dashboard Overview</h2>
                </div>
                
                <div class="flex items-center space-x-4">
                    <button class="text-gray-500 hover:text-gray-700">
                        <i class="fa-regular fa-bell text-xl"></i>
                    </button>
                    <div class="w-8 h-8 rounded-full bg-emerald-600 text-white flex items-center justify-center font-bold">
                        A
                    </div>
                </div>
            </header>
            
            <!-- Dashboard Content -->
            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-100 p-6">
                
                <!-- Stats row -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                    <!-- Stat Card 1 -->
                    <div class="bg-white rounded-lg shadow-sm p-6 flex items-center">
                        <div class="p-3 rounded-full bg-blue-100 text-blue-600 mr-4">
                            <i class="fa-solid fa-wallet text-xl"></i>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 font-medium">Total Revenue</p>
                            <p class="text-2xl font-bold text-gray-900">345,000 RWF</p>
                        </div>
                    </div>
                    <!-- Stat Card 2 -->
                    <div class="bg-white rounded-lg shadow-sm p-6 flex items-center">
                        <div class="p-3 rounded-full bg-emerald-100 text-emerald-600 mr-4">
                            <i class="fa-solid fa-shopping-bag text-xl"></i>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 font-medium">Total Orders</p>
                            <p class="text-2xl font-bold text-gray-900">24</p>
                        </div>
                    </div>
                    <!-- Stat Card 3 -->
                    <div class="bg-white rounded-lg shadow-sm p-6 flex items-center">
                        <div class="p-3 rounded-full bg-purple-100 text-purple-600 mr-4">
                            <i class="fa-solid fa-box text-xl"></i>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 font-medium">Products</p>
                            <p class="text-2xl font-bold text-gray-900" id="productCount">0</p>
                        </div>
                    </div>
                    <!-- Stat Card 4 -->
                    <div class="bg-white rounded-lg shadow-sm p-6 flex items-center">
                        <div class="p-3 rounded-full bg-yellow-100 text-yellow-600 mr-4">
                            <i class="fa-solid fa-users text-xl"></i>
                        </div>
                        <div>
                            <p class="text-sm text-gray-500 font-medium">New Customers</p>
                            <p class="text-2xl font-bold text-gray-900">12</p>
                        </div>
                    </div>
                </div>

                <!-- Recent Orders Table -->
                <div class="bg-white shadow-sm rounded-lg overflow-hidden mb-8">
                    <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                        <h3 class="text-lg font-medium text-gray-900">Recent Orders</h3>
                        <button class="text-emerald-600 hover:text-emerald-800 text-sm font-medium">View All</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Order ID</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Customer</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Amount</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                    <th scope="col" class="relative px-6 py-3"><span class="sr-only">Actions</span></th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200" id="ordersTableBody">
                                <!-- Orders will be injected here -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Product Inventory Summary -->
                <div class="bg-white shadow-sm rounded-lg overflow-hidden">
                    <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                        <h3 class="text-lg font-medium text-gray-900">Product Inventory</h3>
                        <button class="bg-emerald-600 text-white px-4 py-2 rounded text-sm font-medium hover:bg-emerald-700 transition">
                            <i class="fa-solid fa-plus mr-1"></i> Add Product
                        </button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Product</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Price</th>
                                    <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Stock</th>
                                    <th scope="col" class="relative px-6 py-3"><span class="sr-only">Edit</span></th>
                                </tr>
                            </thead>
                            <tbody class="bg-white divide-y divide-gray-200" id="inventoryTableBody">
                                <!-- Inventory will be injected here -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- Data script must be loaded first to access products -->
    <script src="data.js"></script>
    <script src="admin.js"></script>
</body>
</html>
